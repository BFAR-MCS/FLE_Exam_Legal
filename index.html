<html lang="en">
<head>
<meta charset="UTF-8">

<title>RA 10654 Assessment</title>
<style>
body { font-family: Arial, sans-serif; margin: 0; background: #f4f7fb; color: #1f2937; }
.container { max-width: 1000px; margin: 0 auto; padding: 20px; }
.card { background: #fff; border-radius: 14px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); padding: 20px; margin-bottom: 18px; }
h1,h2,h3 { margin-top: 0; }
.topbar { display:grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap:12px; align-items:end; }
label { display:block; font-weight:700; margin-bottom:6px; }
input[type="text"], select { width:100%; padding:10px; border-radius:10px; border:1px solid #d1d5db; box-sizing:border-box; }
button { background:#1d4ed8; color:#fff; border:none; border-radius:10px; padding:11px 16px; cursor:pointer; }
button.secondary { background:#6b7280; }
.meta { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
.pill { background:#e5eefc; color:#1e40af; padding:6px 10px; border-radius:999px; font-size:13px; }
.timer-display { font-size:64px; font-weight:700; text-align:center; background:#0f172a; color:#fff; border-radius:16px; padding:14px; letter-spacing:2px; margin:16px 0; }
.prompt { white-space:pre-wrap; line-height:1.7; font-size:18px; margin:14px 0; }
.option { display:block; border:1px solid #d1d5db; border-radius:10px; padding:12px 14px; margin:10px 0; cursor:pointer; background:#fff; }
.option:hover { background:#f9fafb; }
.option input { margin-right:10px; }
.feedback { margin-top:14px; padding:14px; border-radius:10px; display:none; line-height:1.7; }
.correct { background:#ecfdf5; border:1px solid #10b981; }
.incorrect { background:#fef2f2; border:1px solid #ef4444; }
.score-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap:12px; }
.score-item { background:#f9fafb; border-radius:10px; padding:14px; border:1px solid #e5e7eb; }
.review { max-height:420px; overflow:auto; border:1px solid #e5e7eb; border-radius:10px; padding:10px; background:#fafafa; }
.review-item { border-bottom:1px solid #e5e7eb; padding:10px 0; }
.notice { font-size:14px; color:#475569; margin-top:8px; }
.status { margin-top:12px; padding:12px; border-radius:10px; display:none; }
.status.ok { display:block; background:#ecfdf5; border:1px solid #10b981; }
.status.err { display:block; background:#fef2f2; border:1px solid #ef4444; }
.actions { margin-top:14px; display:flex; gap:10px; flex-wrap:wrap; }
@media (max-width: 900px) {
  .topbar { grid-template-columns: 1fr; }
  .timer-display { font-size:42px; }
}
</style>
</head>

    <div class="timer-display" id="timerDisplay">00:00</div>

    <div class="feedback" id="feedbackBox"></div>

    <div id="reviewWrap" style="display:none;">

      <div class="review" id="reviewBox"></div>
    </div>
  </div>
</div>

let activeQuestions = [];
let currentIndex = 0;
let score = 0;
let submitted = false;
let responses = [];
let participantName = "";
let timerSeconds = 0;
let remainingSeconds = 0;
let timerInterval = null;
let startTime = null;
let endTime = null;

function shuffleArray(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function formatTime(seconds) {
  const mins = Math.floor(seconds / 60);
  const secs = seconds % 60;
  return String(mins).padStart(2,'0') + ':' + String(secs).padStart(2,'0');
}
function updateTimerDisplays(value) {
  document.getElementById('timerDisplay').textContent = value;
  document.getElementById('timerDisplayQuiz').textContent = value;
}
function startTimer() {
  if (timerInterval) clearInterval(timerInterval);
  if (timerSeconds <= 0) { updateTimerDisplays('00:00'); return; }
  remainingSeconds = timerSeconds;
  updateTimerDisplays(formatTime(remainingSeconds));
  timerInterval = setInterval(function() {
    remainingSeconds -= 1;
    updateTimerDisplays(formatTime(Math.max(remainingSeconds, 0)));
    if (remainingSeconds <= 0) {
      clearInterval(timerInterval);
      alert('Time is up. The test will now end.');
      showFinal();
    }
  }, 1000);
}
function timeUsedText() {
  if (!startTime) return '00:00';
  const used = timerSeconds > 0 ? (timerSeconds - Math.max(remainingSeconds, 0)) : Math.floor((endTime - startTime) / 1000);
  return formatTime(Math.max(used, 0));
}
function matchesDifficulty(qdiff, selected) {
  if (!selected) return true;
  if (selected === 'Basic') return qdiff === 'Basic';
  if (selected === 'Intermediate') return qdiff === 'Intermediate';
  if (selected === 'Advanced') return qdiff === 'Advanced';
  if (selected === 'Basic-Intermediate') return qdiff === 'Basic' || qdiff === 'Intermediate';
  if (selected === 'Intermediate-Advanced') return qdiff === 'Intermediate' || qdiff === 'Advanced';
  return true;
}
function startQuiz() {
  participantName = document.getElementById('participantName').value.trim() || 'Unnamed Participant';
  const difficulty = document.getElementById('difficultyFilter').value;
  const countValue = document.getElementById('countFilter').value;
  timerSeconds = parseInt(document.getElementById('timerFilter').value, 10);

  activeQuestions = allQuestions.filter(function(q) { return matchesDifficulty(q.difficulty, difficulty); });
  if (!activeQuestions.length) {
    alert('No questions match the selected filters.');
    return;
  }
  activeQuestions = shuffleArray(activeQuestions);
  if (countValue !== 'all') {
    activeQuestions = activeQuestions.slice(0, Math.min(parseInt(countValue, 10), activeQuestions.length));
  }

  currentIndex = 0;
  score = 0;
  submitted = false;
  responses = [];
  startTime = new Date();
  endTime = null;

  document.getElementById('startCard').style.display = 'none';
  document.getElementById('finalCard').style.display = 'none';
  document.getElementById('reviewWrap').style.display = 'none';
  document.getElementById('quizCard').style.display = 'block';
  document.getElementById('namePill').textContent = participantName;
  startTimer();
  loadQuestion();
}
function loadQuestion() {
  const q = activeQuestions[currentIndex];
  submitted = false;
  document.getElementById('progressPill').textContent = 'Question ' + (currentIndex + 1) + ' / ' + activeQuestions.length;
  document.getElementById('scorePill').textContent = 'Answered: ' + currentIndex;
  document.getElementById('typePill').textContent = q.type === 'multiple_choice' ? 'Multiple Choice' : 'Element Blank with Choices';
  document.getElementById('difficultyPill').textContent = q.difficulty;
  document.getElementById('promptText').textContent = q.prompt;
  document.getElementById('feedbackBox').style.display = 'none';
  document.getElementById('feedbackBox').className = 'feedback';
  document.getElementById('submitBtn').style.display = 'inline-block';
  document.getElementById('nextBtn').style.display = 'none';
  const form = document.getElementById('optionsForm');
  form.innerHTML = '';
  q.options.forEach(function(opt) {
    const label = document.createElement('label');
    label.className = 'option';
    const input = document.createElement('input');
    input.type = 'radio';
    input.name = 'answer';
    input.value = opt;
    label.appendChild(input);
    label.appendChild(document.createTextNode(' ' + opt));
    form.appendChild(label);
  });
}
function submitAnswer() {
  if (submitted) return;
  const selected = document.querySelector('input[name="answer"]:checked');
  if (!selected) {
    alert('Please select an answer first.');
    return;
  }
  submitted = true;
  const q = activeQuestions[currentIndex];
  const selectedValue = selected.value;
  const isCorrect = selectedValue === q.correct;
  if (isCorrect) score += 1;
  responses.push({
    id: q.id,
    prompt: q.prompt,
    selected: selectedValue,
    correct: q.correct,
    isCorrect: isCorrect,
    explanation: q.explanation,
    difficulty: q.difficulty,
    type: q.type
  });
  const feedback = document.getElementById('feedbackBox');
  feedback.style.display = 'block';
  feedback.className = 'feedback ' + (isCorrect ? 'correct' : 'incorrect');
  feedback.innerHTML = '<strong>Answer recorded.</strong>';
  document.getElementById('scorePill').textContent = 'Answered: ' + (currentIndex + 1);
  document.getElementById('submitBtn').style.display = 'none';
  document.getElementById('nextBtn').style.display = 'inline-block';
}
function nextQuestion() {
  currentIndex += 1;
  if (currentIndex >= activeQuestions.length) { showFinal(); return; }
  loadQuestion();
}
function showFinal() {
  if (timerInterval) clearInterval(timerInterval);
  endTime = new Date();
  document.getElementById('quizCard').style.display = 'none';
  document.getElementById('finalCard').style.display = 'block';
  const incorrect = activeQuestions.length - score;
  const percent = activeQuestions.length ? ((score / activeQuestions.length) * 100).toFixed(2) : '0.00';
  document.getElementById('finalName').textContent = participantName;
  document.getElementById('finalCorrect').textContent = score;
  document.getElementById('finalIncorrect').textContent = incorrect;
  document.getElementById('finalPercent').textContent = percent + '%';
  document.getElementById('finalTotal').textContent = activeQuestions.length;
  document.getElementById('finalTime').textContent = timeUsedText();
  const review = document.getElementById('reviewBox');
  review.innerHTML = '';
  responses.forEach(function(r) {
    const div = document.createElement('div');
    div.className = 'review-item';
    div.innerHTML = '<strong>Question ' + r.id + ' — ' + (r.isCorrect ? 'Correct' : 'Incorrect') + '</strong><br><strong>Type:</strong> ' + (r.type === 'multiple_choice' ? 'Multiple Choice' : 'Element Blank with Choices') + ' | <strong>Difficulty:</strong> ' + r.difficulty + '<br><strong>Your Answer:</strong> ' + r.selected + '<br><strong>Correct Answer:</strong> ' + r.correct + '<br><strong>Why:</strong> ' + r.explanation;
    review.appendChild(div);
  });
}
function toggleReview() {
  const wrap = document.getElementById('reviewWrap');
  wrap.style.display = wrap.style.display === 'none' ? 'block' : 'none';
}
async function submitResultsToSheet() {
  const status = document.getElementById('submitStatus');
  const total = activeQuestions.length;
  const incorrect = total - score;
  const percent = total ? ((score / total) * 100).toFixed(2) : '0.00';
  const payload = {
    participantName: participantName,
    batchName: '',
    score: score,
    incorrect: incorrect,
    total: total,
    percent: percent,
    timeUsed: timeUsedText(),
    submittedAt: new Date().toISOString(),
    answers: responses
  };
  try {
    await fetch(GOOGLE_APPS_SCRIPT_URL, {
      method: 'POST',
      headers: {'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    });
    status.className = 'status ok';
    status.textContent = 'Results submitted successfully.';
  } catch (err) {
    status.className = 'status err';
    status.textContent = 'Submission failed. Check your internet connection.';
  }
}
function restartQuiz() {
  if (timerInterval) clearInterval(timerInterval);
  updateTimerDisplays('00:00');
  document.getElementById('finalCard').style.display = 'none';
  document.getElementById('startCard').style.display = 'block';
}
document.getElementById('startBtn').addEventListener('click', startQuiz);
document.getElementById('submitBtn').addEventListener('click', submitAnswer);
document.getElementById('nextBtn').addEventListener('click', nextQuestion);
document.getElementById('sendBtn').addEventListener('click', submitResultsToSheet);
document.getElementById('reviewToggleBtn').addEventListener('click', toggleReview);
document.getElementById('restartBtn').addEventListener('click', restartQuiz);
updateTimerDisplays('00:00');
</script>
